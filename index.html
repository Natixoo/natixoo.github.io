<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Tableau de Bord de Notes</title>
    <script src="https://code.highcharts.com/highcharts.js"> </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; color: #333; margin: 40px auto; max-width: 900px; padding: 0 20px; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .chart-container, .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 40px; }
        form { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; }
        select, input, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
        button { background-color: #2ecc71; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <h1>📊 Mon Tableau de Bord de Notes</h1>

    <!-- GRAPHIQUES -->
    <div class="chart-container"><div id="graphique-colles" style="width:100%; height:400px;"></div></div>
    <div class="chart-container"><div id="graphique-ds" style="width:100%; height:400px;"></div></div>
    <div class="chart-container"><div id="graphique-interros" style="width:100%; height:400px;"></div></div>

    <script>
        // Couleurs de vos matières
        const couleursMatieres = {
            "Physique": "#f39c12", "Chimie": "blue", "Maths": "grey",
            "SII": "green", "Anglais": "purple", "Français": "pink", "Informatique": "red"
        };

        let donneesNotes = {};
        let chartColles, chartDS, chartInterros;

        // Options partagées des graphiques Highcharts
        const optionsPartagees = {
            chart: { type: 'line' },
            yAxis: { title: { text: 'Notes / 20' }, min: 0, max: 20, gridLineDashStyle: 'Dash' },
            xAxis: { title: { text: 'Numéro de l\'évaluation' }, tickInterval: 1 },
            plotOptions: { line: { marker: { enabled: true, radius: 5 }, lineWidth: 3 } },
            tooltip: {
                formatter: function() {
                    const dataset = this.series.yData;
                    const moyenne = (dataset.reduce((a, b) => a + b, 0) / dataset.length).toFixed(2);
                    return `<b>${this.series.name}</b><br/>Évaluation n°${this.x} : <b>${this.y} / 20</b><br/><span style="color:red">Moyenne : ${moyenne}/20</span>`;
                }
            }
        };

        const interros = {
            chart: { type: 'line' },
            yAxis: { title: { text: 'Notes / 10' }, min: 0, max: 10, gridLineDashStyle: 'Dash' },
            xAxis: { title: { text: 'Numéro de l\'évaluation' }, tickInterval: 1 },
            plotOptions: { line: { marker: { enabled: true, radius: 5 }, lineWidth: 3 } },
            tooltip: {
                formatter: function() {
                    const dataset = this.series.yData;
                    const moyenne = (dataset.reduce((a, b) => a + b, 0) / dataset.length).toFixed(2);
                    return `<b>${this.series.name}</b><br/>Évaluation n°${this.x} : <b>${this.y} / 20</b><br/><span style="color:red">Moyenne : ${moyenne}/20</span>`;
                }
            }
        };

        // Fonction pour générer le format attendu par Highcharts à partir du JSON
        function formaterSeries(typeEval) {
            return Object.keys(donneesNotes[typeEval]).map(matiere => {
                return {
                    name: matiere,
                    color: couleursMatieres[matiere],
                    data: donneesNotes[typeEval][matiere]
                };
            });
        }

        // Chargement initial des données depuis le fichier JSON
        fetch('donnees.json')
            .then(response => response.json())
            .then(data => {
                donneesNotes = data;

                // Initialisation du graphique des Colles
                chartColles = Highcharts.chart('graphique-colles', Highcharts.merge(optionsPartagees, {
                    title: { text: 'Suivi des Colles' },
                    series: formaterSeries('colles')
                }));

                // Initialisation du graphique des DS
                chartDS = Highcharts.chart('graphique-ds', Highcharts.merge(optionsPartagees, {
                    title: { text: 'Suivi des Devoirs Surveillés (DS)' },
                    series: formaterSeries('ds')
                }));

                chartInterros = Highcharts.chart('graphique-interros', Highcharts.merge(interros, {
                    title: { text: 'Suivi des Interrogations' },
                    series: formaterSeries('interros')
                }));
            });
    </script>
</body>
</html>
